<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 環境冒煙測試用：1 秒淡入標題，確認 HyperFrames 能在這台電腦渲染 -->
  <style>
    #stage { position: relative; width: 640px; height: 360px; overflow: hidden; background: #0b1220; }
    .clip  { position: absolute; inset: 0; display: grid; place-items: center; }
    #title { font: 700 56px "Segoe UI", sans-serif; color: #fff; opacity: 0; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="smoke" data-start="0"
       data-width="640" data-height="360" data-duration="1" data-fps="30">
    <div id="card" class="clip" data-start="0" data-duration="1" data-track-index="0">
      <div id="title">HyperFrames OK</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to("#title", { opacity: 1, duration: 0.5, ease: "none" }, 0);
    tl.to("#title", { opacity: 1, duration: 0.5, ease: "none" }, 0.5);
    window.__timelines = window.__timelines || {};
    window.__timelines["smoke"] = tl;
  </script>
</body>
</html>
