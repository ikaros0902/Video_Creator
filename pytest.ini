[pytest]
pythonpath = .
testpaths = tests
bdd_features_base_dir = tests/features/
markers =
    tier1: Tier 1 Happy-Path functional compliance checks
    tier2: Tier 2 Boundary, negative and edge case checks
    tier3: Tier 3 Pairwise combinatorial checks
    tier4: Tier 4 Real-world application scenarios
    e2e: End-to-end compliance test suite
    integration: 需要網路、GPU 或真實素材的測試，預設不跑（用 -m integration 執行）
addopts = -m "not integration"
